name: Build Oplus Bypass Charging

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found: $SDKMANAGER"
            exit 1
          fi

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Restore persistent signing key
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          for name in ANDROID_SIGNING_KEYSTORE_BASE64 ANDROID_SIGNING_STORE_PASSWORD ANDROID_SIGNING_KEY_ALIAS ANDROID_SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

          KEYSTORE="$RUNNER_TEMP/oplus-bypass-release.jks"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          echo "ANDROID_SIGNING_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "ANDROID_SIGNING_STORE_PASSWORD=$ANDROID_SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_SIGNING_KEY_ALIAS=$ANDROID_SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_SIGNING_KEY_PASSWORD=$ANDROID_SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'

      - name: Build signed beta APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          apksigner verify --verbose --print-certs "$APK"
          ls -lh "$APK"

      - name: Prepare beta APK
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk "Oplus-Bypass-Charging-v2.0.0-beta.${{ github.run_number }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          path: "Oplus-Bypass-Charging-v2.0.0-beta.${{ github.run_number }}.apk"
          archive: false
          retention-days: 30

      - name: Publish beta test release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="v2.0.0-beta.${{ github.run_number }}"
          APK="Oplus-Bypass-Charging-v2.0.0-beta.${{ github.run_number }}.apk"
          TITLE="Oplus Bypass Charging v2.0.0 Beta Build #${{ github.run_number }}"

          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes "Automated signed beta/test build from commit ${{ github.sha }}.

          All beta and future stable builds use the same persistent signing certificate.
          This is a pre-release build for testing only." \
            --prerelease \
            "$APK"
