name: Build Oplus Bypass Charging

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found: $SDKMANAGER"
            exit 1
          fi

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare release APK
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk Oplus-Bypass-Charging-v2.0.0-debug.apk
          ls -lh Oplus-Bypass-Charging-v2.0.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          path: Oplus-Bypass-Charging-v2.0.0-debug.apk
          archive: false
          retention-days: 30

      - name: Publish beta test release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="v2.0.0-beta.${{ github.run_number }}"
          TITLE="Oplus Bypass Charging v2.0.0 Beta Build #${{ github.run_number }}"

          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes "Automated beta/test build from commit ${{ github.sha }}.

          This is a pre-release build for testing only.
          Stable release will be published separately after testing is complete." \
            --prerelease \
            Oplus-Bypass-Charging-v2.0.0-debug.apk#Oplus-Bypass-Charging-v2.0.0-beta.${{ github.run_number }}.apk
